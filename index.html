<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR: Liên kết Hóa học (Bản Sửa Lỗi Camera & Text)</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        #webcam { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -100; }
        .a-canvas { background-color: transparent !important; }
        
        #ui { position: fixed; bottom: 30px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 100; }
        .btn { padding: 15px 30px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 80%; max-width: 300px; }
        .btn-ion { background: #e74c3c; }
        .btn-cov { background: #3498db; }
        .btn-start { background: #2ecc71; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 18px; z-index: 200; font-weight: bold; border-radius: 30px; border: none; color: white;}
        
        #hint { color: white; text-align: center; text-shadow: 1px 1px 2px black; margin-bottom: 5px; font-size: 15px; }
        #browser-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #e74c3c; color: white; text-align: center; padding: 15px; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

    <!-- CẢNH BÁO TRÌNH DUYỆT NHÚNG -->
    <div id="browser-warning">
        ⚠️ Vui lòng nhấn vào dấu 3 chấm góc phải và chọn "Mở bằng trình duyệt ngoài (Chrome/Safari)" để Camera hoạt động!
    </div>

    <!-- Video nền -->
    <video id="webcam" autoplay playsinline webkit-playsinline muted></video>

    <!-- Nút Khởi Động -->
    <button id="startBtn" class="btn-start">BẤM ĐỂ MỞ CAMERA</button>

    <!-- Menu Tùy Chọn -->
    <div id="ui" style="display: none;">
        <div id="hint">👆 Vuốt màn hình để xoay 360°</div>
        <button class="btn btn-ion" onclick="playIonic()">Liên kết Ion (NaCl)</button>
        <button class="btn btn-cov" onclick="playCovalent()">LK Cộng hóa trị (H2)</button>
    </div>

    <a-scene embedded renderer="alpha: true; antialias: true" vr-mode-ui="enabled: false">
        <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
        <a-entity id="pivot" position="0 1.2 -4" scale="0.7 0.7 0.7"></a-entity>
        <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
        // KIỂM TRA TRÌNH DUYỆT NHÚNG (Zalo, Messenger)
        const isFacebookApp = () => {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Zalo") > -1);
        };
        if(isFacebookApp()){
            document.getElementById('browser-warning').style.display = 'block';
        }

        // ==========================================
        // 1. KHỞI ĐỘNG CAMERA CHUẨN KÉP
        // ==========================================
        document.getElementById('startBtn').addEventListener('click', async () => {
            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = "Đang kết nối Camera...";
            
            try {
                // Thử cách 1: Xin quyền camera sau (phổ biến)
                let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                startVideoStream(stream);
            } catch (err) {
                try {
                    // Thử cách 2: Xin bất kỳ camera nào nếu cách 1 thất bại
                    let stream2 = await navigator.mediaDevices.getUserMedia({ video: true });
                    startVideoStream(stream2);
                } catch(err2) {
                     startBtn.innerText = "❌ LỖI: HÃY CẤP QUYỀN CAMERA";
                     startBtn.style.background = "#e74c3c";
                     alert("Trình duyệt không thể truy cập Camera. Hãy chắc chắn bạn đã cấp quyền hoặc thử mở bằng Google Chrome/Safari.");
                }
            }
        });

        function startVideoStream(stream) {
            const video = document.getElementById('webcam');
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('ui').style.display = 'flex';
                document.getElementById('browser-warning').style.display = 'none';
            };
        }

        // ==========================================
        // 2. VUỐT ĐỂ XOAY 360 ĐỘ
        // ==========================================
        let isDragging = false;
        let prevX = 0, prevY = 0;
        const pivot = document.getElementById('pivot');

        window.addEventListener('pointerdown', (e) => {
            if(e.target.tagName === 'BUTTON') return; 
            isDragging = true;
            prevX = e.clientX; prevY = e.clientY;
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - prevX;
            let deltaY = e.clientY - prevY;
            pivot.object3D.rotation.y += deltaX * 0.01;
            pivot.object3D.rotation.x += deltaY * 0.01;
            prevX = e.clientX; prevY = e.clientY;
        });
        window.addEventListener('pointerup', () => isDragging = false);


        // ==========================================
        // 3. HÀM VẼ NHÃN (KHÔNG DÙNG CANVAS)
        // ==========================================
        function createText(parent, text, color, px, py, pz, scale="1 1 1") {
            let t = document.createElement('a-text');
            // Dùng chữ ko dấu để Aframe hỗ trợ tốt nhất
            let noAccentText = text.replace(/Phân tử/g, "Phan tu");
            t.setAttribute('value', noAccentText);
            t.setAttribute('color', color);
            t.setAttribute('align', 'center');
            t.setAttribute('position', `${px} ${py} ${pz}`);
            t.setAttribute('scale', scale);
            parent.appendChild(t);
            return t;
        }

        // ==========================================
        // 4. HÀM TẠO NGUYÊN TỬ
        // ==========================================
        function createAtom(nucleusColor, eColor, shellConfig, posX) {
            let atom = document.createElement('a-entity');
            atom.setAttribute('position', `${posX} 0 0`);

            let nuc = document.createElement('a-sphere');
            nuc.setAttribute('radius', '0.2'); 
            nuc.setAttribute('color', nucleusColor);
            atom.appendChild(nuc);
            
            let shells = [];
            shellConfig.forEach((eCount, idx) => {
                let radius = 0.4 + (idx * 0.3);
                let shell = document.createElement('a-entity');
                
                let ring = document.createElement('a-torus');
                ring.setAttribute('radius', radius); 
                ring.setAttribute('radius-tubular', '0.005');
                ring.setAttribute('rotation', '90 0 0'); 
                ring.setAttribute('color', '#ecf0f1'); 
                ring.setAttribute('opacity', '0.5');
                shell.appendChild(ring);
                
                for(let i=0; i<eCount; i++) {
                    let angle = (i / eCount) * Math.PI * 2;
                    let e = document.createElement('a-sphere');
                    e.setAttribute('radius', '0.05');
                    e.setAttribute('color', eColor); 
                    e.setAttribute('position', `${Math.cos(angle)*radius} 0 ${Math.sin(angle)*radius}`);
                    shell.appendChild(e);
                }
                
                let speed = 2500 + (idx * 1500); 
                shell.setAttribute('animation', `property: rotation; to: 0 360 0; dur: ${speed}; loop: true; easing: linear`);
                
                atom.appendChild(shell);
                shells.push(shell);
            });

            pivot.appendChild(atom);
            return { entity: atom, shells: shells };
        }

        // ==========================================
        // 5. LIÊN KẾT ION
        // ==========================================
        function playIonic() {
            pivot.innerHTML = ''; 
            pivot.setAttribute('rotation', '0 0 0');

            let Na = createAtom('#e74c3c', '#ff9f43', [2, 8, 1], -1.6);
            let Cl = createAtom('#2ecc71', '#00cec9', [2, 8, 7], 1.6);
            
            let labelNa = createText(Na.entity, 'Na', '#ff7675', 0, 1.3, 0, '1.5 1.5 1.5');
            let labelCl = createText(Cl.entity, 'Cl', '#55efc4', 0, 1.3, 0, '1.5 1.5 1.5');

            setTimeout(() => {
                let naOuter = Na.shells[2];
                let clOuter = Cl.shells[2];
                
                naOuter.removeAttribute('animation'); naOuter.setAttribute('rotation', '0 0 0');
                clOuter.removeAttribute('animation'); clOuter.setAttribute('rotation', '0 0 0');

                naOuter.setAttribute('animation__fade', 'property: scale; to: 0 0 0; dur: 800; easing: easeInQuad');

                let flyingE = document.createElement('a-sphere');
                flyingE.setAttribute('radius', '0.05');
                flyingE.setAttribute('color', '#ff9f43'); 
                flyingE.setAttribute('position', '-0.6 0 0');
                pivot.appendChild(flyingE);

                flyingE.setAttribute('animation', 'property: position; to: 0.6 0 0; dur: 2500; easing: easeInOutQuad');

                setTimeout(() => {
                    pivot.removeChild(flyingE); 

                    let newE = document.createElement('a-sphere');
                    newE.setAttribute('radius', '0.05');
                    newE.setAttribute('color', '#ff9f43'); 
                    newE.setAttribute('position', '-1.0 0 0'); 
                    clOuter.appendChild(newE);

                    clOuter.setAttribute('animation', `property: rotation; to: 0 360 0; dur: 5500; loop: true; easing: linear`);

                    Na.entity.setAttribute('animation', 'property: position; to: -0.85 0 0; dur: 1500; easing: easeOutQuad');
                    Cl.entity.setAttribute('animation', 'property: position; to: 0.85 0 0; dur: 1500; easing: easeOutQuad');

                    // Thay nhãn thành Ion (Dùng child text để không bao giờ lệch)
                    Na.entity.removeChild(labelNa);
                    let newNaLabel = createText(Na.entity, 'Na', '#ff7675', 0, 1.3, 0, '1.5 1.5 1.5');
                    createText(newNaLabel, '+', '#ff7675', 0.28, 0.2, 0, '0.7 0.7 0.7'); 

                    Cl.entity.removeChild(labelCl);
                    let newClLabel = createText(Cl.entity, 'Cl', '#55efc4', 0, 1.3, 0, '1.5 1.5 1.5');
                    createText(newClLabel, '-', '#55efc4', 0.22, 0.2, 0, '0.7 0.7 0.7');

                }, 2500); 
            }, 1500); 
        }

        // ==========================================
        // 6. LIÊN KẾT CỘNG HÓA TRỊ (H2)
        // ==========================================
        function playCovalent() {
            pivot.innerHTML = ''; 
            pivot.setAttribute('rotation', '0 0 0');

            let H1 = createAtom('#0984e3', '#f1c40f', [1], -1.2);
            let H2 = createAtom('#0984e3', '#ff7675', [1], 1.2);

            let labelH1 = createText(H1.entity, 'H', '#00cec9', 0, 0.7, 0, '1.5 1.5 1.5');
            let labelH2 = createText(H2.entity, 'H', '#00cec9', 0, 0.7, 0, '1.5 1.5 1.5');

            setTimeout(() => {
                H1.shells[0].removeAttribute('animation'); H1.shells[0].setAttribute('rotation', '0 0 0');
                H2.shells[0].removeAttribute('animation'); H2.shells[0].setAttribute('rotation', '0 180 0'); 

                H1.entity.setAttribute('animation', 'property: position; to: -0.25 0 0; dur: 1500; easing: easeInOutQuad');
                H2.entity.setAttribute('animation', 'property: position; to: 0.25 0 0; dur: 1500; easing: easeInOutQuad');

                setTimeout(() => {
                    H1.entity.removeChild(labelH1);
                    H2.entity.removeChild(labelH2);
                    
                    // Gắn cứng số 2 vào chữ H
                    let molText = createText(pivot, 'Phan tu H', '#00cec9', -0.1, 0.9, 0, '1.5 1.5 1.5');
                    createText(molText, '2', '#00cec9', 0.48, -0.15, 0, '0.7 0.7 0.7');

                    H1.shells[0].innerHTML = '<a-torus radius="0.4" radius-tubular="0.005" rotation="90 0 0" color="#ecf0f1" opacity="0.5"></a-torus>';
                    H2.shells[0].innerHTML = '<a-torus radius="0.4" radius-tubular="0.005" rotation="90 0 0" color="#ecf0f1" opacity="0.5"></a-torus>';

                    let sharedOrbit = document.createElement('a-entity');
                    
                    let newE1 = document.createElement('a-sphere');
                    newE1.setAttribute('radius', '0.05'); newE1.setAttribute('color', '#f1c40f'); 
                    newE1.setAttribute('position', '0 0.15 0');
                    
                    let newE2 = document.createElement('a-sphere');
                    newE2.setAttribute('radius', '0.05'); newE2.setAttribute('color', '#ff7675'); 
                    newE2.setAttribute('position', '0 -0.15 0');
                    
                    sharedOrbit.appendChild(newE1);
                    sharedOrbit.appendChild(newE2);
                    pivot.appendChild(sharedOrbit);

                    sharedOrbit.setAttribute('animation', 'property: rotation; to: 0 0 360; dur: 1500; loop: true; easing: linear');

                }, 1500);
            }, 1500);
        }
    </script>
</body>
</html>
