<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- THẺ QUAN TRỌNG NHẤT ĐỂ CHỐNG LỖI ZOOM MÀN HÌNH TRÊN ĐIỆN THOẠI -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR: Liên kết Hóa học (Bản Chuẩn Nhất)</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #000; }
        
        #camera-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; background-color: #000; }
        .a-canvas { background-color: transparent !important; }
        
        #ui-container { position: absolute; bottom: 5%; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 999; }
        .btn { padding: 15px 20px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); width: 85%; max-width: 300px; text-align: center; }
        .btn:active { transform: scale(0.95); }
        .btn-ion { background: #e74c3c; }
        .btn-cov { background: #3498db; }
        
        .btn-start { background: #2ecc71; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; font-size: 18px; z-index: 1000; white-space: nowrap; }
        #instruction { color: white; text-shadow: 1px 1px 3px black; text-align: center; margin-bottom: 5px; font-size: 16px;}
    </style>

    <script>
        // COMPONENT VUỐT ĐỂ XOAY (Đã sửa lỗi chạm cảm ứng trên điện thoại)
        AFRAME.registerComponent('drag-rotate', {
            schema: { speed: {default: 1.5} },
            init: function () {
                this.ifMouseDown = false;
                this.x_cord = 0; this.y_cord = 0;
                this.OnDocumentMouseDown = this.OnDocumentMouseDown.bind(this);
                this.OnDocumentMouseUp = this.OnDocumentMouseUp.bind(this);
                this.OnDocumentMouseMove = this.OnDocumentMouseMove.bind(this);
                
                document.addEventListener('mousedown', this.OnDocumentMouseDown);
                document.addEventListener('mouseup', this.OnDocumentMouseUp);
                document.addEventListener('mousemove', this.OnDocumentMouseMove);
                document.addEventListener('touchstart', this.OnDocumentMouseDown);
                document.addEventListener('touchend', this.OnDocumentMouseUp);
                document.addEventListener('touchmove', this.OnDocumentMouseMove);
            },
            OnDocumentMouseDown: function (event) {
                this.ifMouseDown = true;
                this.x_cord = event.clientX || (event.touches ? event.touches[0].clientX : 0);
                this.y_cord = event.clientY || (event.touches ? event.touches[0].clientY : 0);
            },
            OnDocumentMouseUp: function () { this.ifMouseDown = false; },
            OnDocumentMouseMove: function (event) {
                if (this.ifMouseDown) {
                    let x_temp = event.clientX;
                    let y_temp = event.clientY;
                    if(event.touches && event.touches.length > 0) {
                        x_temp = event.touches[0].clientX;
                        y_temp = event.touches[0].clientY;
                    }
                    var deltaX = x_temp - this.x_cord;
                    var deltaY = y_temp - this.y_cord;
                    
                    this.el.object3D.rotation.y += deltaX * this.data.speed * 0.01;
                    this.el.object3D.rotation.x += deltaY * this.data.speed * 0.01;
                    this.x_cord = x_temp; this.y_cord = y_temp;
                }
            }
        });
    </script>
</head>
<body>

    <video id="camera-bg" autoplay muted playsinline></video>
    <button id="startBtn" class="btn btn-start">MỞ CAMERA BẮT ĐẦU</button>

    <div id="ui-container" style="display: none;">
        <div id="instruction">👇 Vuốt màn hình để xoay mô hình 360°</div>
        <button class="btn btn-ion" onclick="playIonic()">Liên kết Ion (NaCl)</button>
        <button class="btn btn-cov" onclick="playCovalent()">LK Cộng hóa trị (H2)</button>
    </div>

    <a-scene vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true">
        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <!-- Khối chứa toàn bộ mô hình, có gắn thuộc tính vuốt để xoay -->
        <a-entity id="main-scene" position="0 1.2 -3" drag-rotate></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        document.getElementById('startBtn').addEventListener('click', () => {
            if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => { document.getElementById('camera-bg').srcObject = stream; })
                .catch(err => { alert("Vui lòng cấp quyền Camera!"); });
            }
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('ui-container').style.display = 'flex';
        });

        const scene = document.getElementById('main-scene');

        // Hàm tạo Nhãn (Đã khắc phục 100% lỗi lệch chữ)
        function createLabel(mainStr, subSupStr, type, color, pos) {
            let wrapper = document.createElement('a-entity');
            wrapper.setAttribute('position', pos);

            let main = document.createElement('a-text');
            main.setAttribute('value', mainStr);
            main.setAttribute('color', color);
            main.setAttribute('align', 'center');
            wrapper.appendChild(main);

            if (subSupStr) {
                let subSup = document.createElement('a-text');
                subSup.setAttribute('value', subSupStr);
                subSup.setAttribute('color', color);
                subSup.setAttribute('align', 'left'); 
                subSup.setAttribute('scale', '0.6 0.6 0.6');
                
                let xOffset = mainStr.length * 0.15; 
                let yOffset = (type === 'sup') ? 0.15 : -0.15; 
                subSup.setAttribute('position', `${xOffset} ${yOffset} 0`);
                wrapper.appendChild(subSup);
            }
            return wrapper;
        }

        // Hàm tạo nguyên tử
        function createAtom(symbol, nucleusColor, electronColor, shellConfig, position) {
            let atom = document.createElement('a-entity');
            atom.setAttribute('position', position);

            let nuc = document.createElement('a-sphere');
            nuc.setAttribute('radius', '0.15'); 
            nuc.setAttribute('color', nucleusColor);
            atom.appendChild(nuc);

            let label = createLabel(symbol, '', '', '#ffffff', '0 0.35 0');
            atom.appendChild(label);
            
            let shellEntities = [];
            shellConfig.forEach((eCount, shellIndex) => {
                let radius = 0.35 + (shellIndex * 0.25);
                let shell = document.createElement('a-entity');
                
                let ring = document.createElement('a-torus');
                ring.setAttribute('radius', radius); ring.setAttribute('radius-tubular', '0.003');
                ring.setAttribute('rotation', '90 0 0'); ring.setAttribute('color', '#ecf0f1'); ring.setAttribute('opacity', '0.4');
                shell.appendChild(ring);
                
                for(let i=0; i<eCount; i++) {
                    let angle = (i / eCount) * Math.PI * 2;
                    let e = document.createElement('a-sphere');
                    e.classList.add('electron'); 
                    e.setAttribute('radius', '0.04');
                    e.setAttribute('color', electronColor); 
                    e.setAttribute('position', `${Math.cos(angle)*radius} 0 ${Math.sin(angle)*radius}`);
                    shell.appendChild(e);
                }
                
                let speed = 3000 + (shellIndex * 1500);
                shell.setAttribute('animation', `property: rotation; to: 0 360 0; dur: ${speed}; loop: true; easing: linear`);
                
                atom.appendChild(shell);
                shellEntities.push(shell);
            });

            return { atom, label, shellEntities };
        }

        // ==========================================
        // 1. LIÊN KẾT ION (Na + Cl)
        // ==========================================
        function playIonic() {
            scene.innerHTML = ''; 
            scene.setAttribute('rotation', '0 0 0');

            // Khoảng cách an toàn để vừa màn hình dọc
            let Na = createAtom('Na', '#e74c3c', '#ff9f43', [2, 8, 1], '-0.75 0 0');
            let Cl = createAtom('Cl', '#2ecc71', '#00cec9', [2, 8, 7], '0.75 0 0');
            
            scene.appendChild(Na.atom);
            scene.appendChild(Cl.atom);

            setTimeout(() => {
                let naOuterShell = Na.shellEntities[2];
                naOuterShell.removeAttribute('animation');
                naOuterShell.setAttribute('rotation', '0 0 0');
                naOuterShell.setAttribute('animation__fade', 'property: scale; to: 0 0 0; dur: 1000; easing: easeInQuad');

                let flyingE = document.createElement('a-sphere');
                flyingE.setAttribute('radius', '0.04');
                flyingE.setAttribute('color', '#ff9f43'); 
                flyingE.setAttribute('position', '-0.35 0 0');
                scene.appendChild(flyingE);

                flyingE.setAttribute('animation', 'property: position; to: 0.35 0 0; dur: 1000; easing: easeInOutQuad');

                setTimeout(() => {
                    scene.removeChild(flyingE); 

                    let newE = document.createElement('a-sphere');
                    newE.setAttribute('radius', '0.04');
                    newE.setAttribute('color', '#ff9f43');
                    newE.setAttribute('position', '-0.85 0 0'); 
                    Cl.shellEntities[2].appendChild(newE);

                    Na.atom.setAttribute('animation', 'property: position; to: -0.35 0 0; dur: 1500; easing: easeOutQuad');
                    Cl.atom.setAttribute('animation', 'property: position; to: 0.35 0 0; dur: 1500; easing: easeOutQuad');

                    // Sửa lỗi Crash: Xóa nhãn cũ và thêm nhãn mới an toàn
                    Na.atom.removeChild(Na.label);
                    let newNaLabel = createLabel('Na', '+', 'sup', '#ff7675', '0 0.35 0');
                    Na.atom.appendChild(newNaLabel);
                    Na.label = newNaLabel;

                    Cl.atom.removeChild(Cl.label);
                    let newClLabel = createLabel('Cl', '-', 'sup', '#55efc4', '0 0.35 0');
                    Cl.atom.appendChild(newClLabel);
                    Cl.label = newClLabel;

                }, 1000); 
            }, 2000);
        }

        // ==========================================
        // 2. LIÊN KẾT CỘNG HÓA TRỊ (H2)
        // ==========================================
        function playCovalent() {
            scene.innerHTML = ''; 
            scene.setAttribute('rotation', '0 0 0');

            let H1 = createAtom('H', '#0984e3', '#f1c40f', [1], '-0.6 0 0');
            let H2 = createAtom('H', '#0984e3', '#ff7675', [1], '0.6 0 0');

            scene.appendChild(H1.atom);
            scene.appendChild(H2.atom);

            setTimeout(() => {
                H1.shellEntities[0].removeAttribute('animation');
                H2.shellEntities[0].removeAttribute('animation');
                H1.shellEntities[0].setAttribute('rotation', '0 0 0');
                H2.shellEntities[0].setAttribute('rotation', '0 180 0'); 

                H1.atom.setAttribute('animation', 'property: position; to: -0.25 0 0; dur: 1500; easing: easeInOutQuad');
                H2.atom.setAttribute('animation', 'property: position; to: 0.25 0 0; dur: 1500; easing: easeInOutQuad');

                setTimeout(() => {
                    H1.atom.removeChild(H1.label);
                    H2.atom.removeChild(H2.label);
                    
                    let molLabel = createLabel('Phan tu H', '2', 'sub', '#00cec9', '0 0.5 0');
                    scene.appendChild(molLabel);

                    H1.shellEntities[0].querySelector('.electron').setAttribute('visible', 'false');
                    H2.shellEntities[0].querySelector('.electron').setAttribute('visible', 'false');

                    let sharedOrbit = document.createElement('a-entity');
                    
                    let newE1 = document.createElement('a-sphere');
                    newE1.setAttribute('radius', '0.05'); 
                    newE1.setAttribute('color', '#f1c40f'); 
                    newE1.setAttribute('position', '0 0.1 0');
                    
                    let newE2 = document.createElement('a-sphere');
                    newE2.setAttribute('radius', '0.05'); 
                    newE2.setAttribute('color', '#ff7675'); 
                    newE2.setAttribute('position', '0 -0.1 0');
                    
                    sharedOrbit.appendChild(newE1);
                    sharedOrbit.appendChild(newE2);
                    scene.appendChild(sharedOrbit);

                    sharedOrbit.setAttribute('animation', 'property: rotation; to: 0 0 360; dur: 1500; loop: true; easing: linear');

                }, 1500);
            }, 2000);
        }
    </script>
</body>
</html>
